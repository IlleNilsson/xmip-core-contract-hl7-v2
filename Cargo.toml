[package]
name = "xmip-core-contract-hl7-v2"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-contract-hl7-v2"
description = "HL7 v2 content contract: a sound ER7 message always, of a bound message type and version when a Location names one; composes the acknowledgement. A xmip-core-contract technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The Contract trait and its value types live there.
contract = { workspace = true, optional = true }
# The settings this technology declares (xcore::settings), read through
# contract::ContractFactory (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }
stream = { workspace = true, optional = true }
# The one segment walk (`message::segment`), which the ER7 shape sections
# by too: the reader hands it the separators MSH declares (er7.rs).
message = { workspace = true, optional = true }
# The shape of the same standard, whose reader of the `MSH` is the one
# (`encoding`): a contract technology depends on the shape of its own
# standard and on no other technology (ADR-0044, amendment 2026-11-15).
er7_shape = { workspace = true, optional = true }

[features]
# The code and its declaration: the contract guide,
# module/core/capability/contract/doc/adding-a-contract.md.
default = ["declaration", "dep:contract", "dep:stream", "dep:message", "dep:er7_shape"]
# The declaration alone.
declaration = []

[dev-dependencies]
# The parent's Stream fixture, for the tests only (ADR-0044).
contract = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
